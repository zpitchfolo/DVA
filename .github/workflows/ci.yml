name: DVA frontend checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

defaults:
  run:
    working-directory: app

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Report dependency audit details
        run: |
          npm audit --json > npm-audit-report.json || true
          node -e 'const report = require("./npm-audit-report.json"); const vulnerabilities = report.vulnerabilities ?? {}; const entries = Object.entries(vulnerabilities); console.log(`Audited packages with findings: ${entries.length}`); for (const [name, item] of entries) console.log(JSON.stringify({ name, severity: item.severity, direct: item.isDirect, range: item.range, fixAvailable: item.fixAvailable }));'
      - name: Run tests
        run: npm test
      - name: Type-check and build
        run: npm run build
